      <section class="section_body template">

        <h2 class="title">必要事項をご入力し、送信してください</h2>
        <p>お問い合わせいただいた内容には、通常1週間（5営業日）以内を目安にご連絡いたします。</p>
        <p>なお、内容によってはお時間をいただく場合や、営業、宣伝を目的としたお問い合わせには返信いたしかねる場合がございますので、あらかじめご了承ください。</p>
        <p>ご入力いただいた個人情報は、連絡の目的にのみ利用し、ご本人の同意なく第三者へ開示、提供することはありません。</p>

        <div class="form-wrap">

          <form name="contact" method="POST" data-netlify="true" action="/contact/thanks/">
            <input type="hidden" name="form-name" value="contact">

            <div class="form-group">
              <label for="name">
                お名前<span class="required">※ 必須</span>
              </label>
              <input id="name" name="name" type="text" required aria-required="true" autocomplete="name">
            </div>

            <div class="form-group">
              <label for="email">
                E-mailアドレス<span class="required">※ 必須</span>
              </label>
              <input id="email" name="email" type="email" placeholder="sample@example.com" required aria-required="true" autocomplete="email">
            </div>

            <div class="form-group">
              <label for="tel">
                電話番号
              </label>
              <input id="tel" name="tel" type="tel" placeholder="090-1234-5678" autocomplete="tel">
            </div>

            <div class="form-group">
              <label for="type">
                お問い合わせ種別<span class="required">※ 必須</span>
              </label>
              <select id="type" name="type" required aria-required="true">
                <option value="">選択してください</option>
                <option value="お問い合わせ">お問い合わせ</option>
                <option value="採用について">採用について</option>
                <option value="その他">その他</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message">
                内容（具体的に）<span class="required">※ 必須</span>
              </label>
              <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
            </div>

            <button type="submit" class="btn-flat-border">送信する</button>
          </form>

        </div>

      </section>
