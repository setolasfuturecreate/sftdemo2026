<input type="password" id="pw">
<button onclick="login()">ログイン</button>

<script>
function login() {

    const password = "demo2026";

    if(document.getElementById("pw").value === password){
        sessionStorage.setItem("demo_auth", "ok");
        location.href = "index.html";
    } else {
        alert("パスワードが違います");
    }
}
</script>
